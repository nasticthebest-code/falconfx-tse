[project]
name = "falconfx-tse"
version = "0.1.0"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "uvicorn[standard]>=0.30",
    "requests>=2.31",
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]


[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
